name: Build Godot for iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Godot Engine & Templates
        run: |
          # 1. Descargar e instalar el motor Godot 4.2.2
          curl -L https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_macos.universal.zip -o godot.zip
          unzip -q godot.zip
          sudo mv Godot.app/Contents/MacOS/Godot /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          # 2. Descargar e instalar las plantillas de exportación oficiales
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          curl -L https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz -o templates.tpz
          unzip -q templates.tpz -d temp_templates
          mv temp_templates/templates/* ~/.local/share/godot/export_templates/4.2.2.stable/
          rm -rf temp_templates templates.tpz godot.zip

      - name: Export Project for iOS
        run: |
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios/SuperMario.xcodeproj

      - name: Upload Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-project
          path: build/ios/
