name: Build Godot for iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Godot
        uses: abarrak/godot-action@v2
        with:
          version: 4.2.2
          include-templates: true

      - name: Export Project for iOS
        run: |
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios/game.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-export
          path: build/ios/
