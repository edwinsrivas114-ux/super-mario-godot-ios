name: Build Godot for iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Godot Headless for macOS
        run: |
          curl -L https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_macos.universal.zip -o godot.zip
          unzip godot.zip
          mv Godot.app/Contents/MacOS/Godot /usr/local/bin/godot

      - name: Export Project for iOS
        run: |
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios/game.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-export
          path: build/ios/
