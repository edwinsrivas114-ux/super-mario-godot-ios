name: Build Godot for iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.2.2

      - name: Export Project for iOS
        run: |
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios/SuperMario.xcodeproj

      - name: Upload Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-project
          path: build/ios/
